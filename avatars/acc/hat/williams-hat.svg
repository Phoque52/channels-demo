<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="wh-dome">
      <path d="M11 31 Q50 1 89 31 Z"/>
    </clipPath>
  </defs>
  <!-- Front panel - solid purple -->
  <g clip-path="url(#wh-dome)">
    <rect x="11" y="0" width="56" height="32" fill="#7C3AED"/>
    <!-- Mesh back panel -->
    <rect x="67" y="0" width="22" height="32" fill="#4C1D95" opacity="0.85"/>
    <line x1="74" y1="3" x2="74" y2="29" stroke="rgba(0,0,0,0.12)" stroke-width="0.6"/>
    <line x1="81" y1="3" x2="81" y2="29" stroke="rgba(0,0,0,0.12)" stroke-width="0.6"/>
  </g>
  <!-- Dome outline -->
  <path d="M11 31 Q50 1 89 31" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  <!-- Brim -->
  <ellipse cx="50" cy="31" rx="42" ry="7" fill="#1a1a1a"/>
  <ellipse cx="50" cy="30" rx="40" ry="5.5" fill="#2b2b2b"/>
  <!-- Snapback detail -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Top button -->
  <circle cx="50" cy="4" r="3" fill="rgba(0,0,0,0.4)"/>
  <circle cx="50" cy="4" r="2" fill="#a855f7"/>
</svg>
