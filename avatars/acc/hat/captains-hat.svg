<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Flat rectangular crown — same structure as military-cap, white -->
  <path d="M 18 30 L 18 20 Q 50 11 82 20 L 82 30 Z" fill="#f2f2f2"/>
  <!-- Slightly darker top panel -->
  <path d="M 22 20 Q 50 12 78 20 Z" fill="#e0e0e0"/>
  <!-- Flat trapezoidal visor (black) -->
  <path d="M 14 30 L 86 30 L 82 35 L 18 35 Z" fill="#1a1a1a"/>
  <!-- Visor underside shadow -->
  <line x1="18" y1="35" x2="82" y2="35" stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>
  <!-- Crown band at base -->
  <rect x="18" y="27" width="64" height="3" rx="0.5" fill="#d8d8d8"/>
  <!-- Center seam -->
  <line x1="50" y1="12" x2="50" y2="30" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <!-- Front badge — gold circle -->
  <circle cx="50" cy="23" r="3.5" fill="#e8e8e8" stroke="rgba(210,180,60,0.9)" stroke-width="1"/>
  <circle cx="50" cy="23" r="1.5" fill="rgba(210,180,60,0.7)"/>
</svg>
