<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Flat rectangular crown (more angular than a baseball cap) -->
  <path d="M 18 30 L 18 20 Q 50 11 82 20 L 82 30 Z" fill="#4b5320"/>
  <!-- Darker top panel detail -->
  <path d="M 22 20 Q 50 12 78 20 Z" fill="#3a4118"/>
  <!-- Flat trapezoidal visor -->
  <path d="M 14 30 L 86 30 L 82 35 L 18 35 Z" fill="#2e3312"/>
  <!-- Visor underside shadow -->
  <line x1="18" y1="35" x2="82" y2="35" stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>
  <!-- Crown band at base -->
  <rect x="18" y="27" width="64" height="3" rx="0.5" fill="#3a4118"/>
  <!-- Center seam -->
  <line x1="50" y1="12" x2="50" y2="30" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <!-- Front badge — small golden circle -->
  <circle cx="50" cy="23" r="3.5" fill="#2e3312" stroke="rgba(210,180,60,0.85)" stroke-width="1"/>
  <circle cx="50" cy="23" r="1.5" fill="rgba(210,180,60,0.65)"/>
</svg>
